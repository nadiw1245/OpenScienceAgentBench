name: Update arXiv digest

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-digest-main
  cancel-in-progress: false

jobs:
  update-digest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate paper digest
        run: python scripts/update_digest.py --days 3 --api-limit 2000 --max-papers 100

      - name: Commit digest when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json docs/latest.md
          if git diff --cached --quiet; then
            echo "The digest has no changes."
          else
            git commit -m "Update arXiv research digest"
            git push
          fi
