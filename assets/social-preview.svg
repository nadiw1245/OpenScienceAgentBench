<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">OpenScienceAgentBench</title>
  <desc id="description">An arXiv research tracker with an evidence-aware AI advisor for emerging researchers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.58" stop-color="#10243A"/>
      <stop offset="1" stop-color="#192B47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68E0CF"/>
      <stop offset="1" stop-color="#78A8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1025 112) rotate(135) scale(560 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A8CFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#5A8CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9FC3E5" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020914" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>
  <path d="M0 510C240 430 430 590 675 500S1050 390 1280 468V640H0Z" fill="#0B1728" fill-opacity=".32"/>

  <g transform="translate(86 92)">
    <rect x="0" y="0" width="316" height="48" rx="24" fill="#DFF9F4" fill-opacity=".1" stroke="#7DE3D1" stroke-opacity=".48"/>
    <circle cx="25" cy="24" r="6" fill="#68E0CF"/>
    <text x="44" y="30" fill="#BEECE5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.1">ARXIV TRACKER  /  RESEARCH ADVISOR</text>
  </g>

  <text x="86" y="248" fill="#F4F8FF" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.5">OpenScience</text>
  <text x="86" y="316" fill="#F4F8FF" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.5">AgentBench</text>
  <text x="90" y="380" fill="#AFC4DA" font-family="Segoe UI, Arial, sans-serif" font-size="23">Follow new AI research.</text>
  <text x="90" y="414" fill="#AFC4DA" font-family="Segoe UI, Arial, sans-serif" font-size="23">Find a direction worth pursuing.</text>

  <g transform="translate(90 478)">
    <circle cx="7" cy="8" r="5" fill="#68E0CF"/>
    <text x="23" y="14" fill="#D6E6F5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">TRACEABLE PAPER SOURCES</text>
    <circle cx="260" cy="8" r="5" fill="#78A8FF"/>
    <text x="276" y="14" fill="#D6E6F5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">PRACTICAL RESEARCH ROADMAPS</text>
  </g>

  <g filter="url(#shadow)" transform="translate(844 130) rotate(4 150 180)">
    <rect x="36" y="34" width="300" height="362" rx="24" fill="#243A58" stroke="#A5C0DE" stroke-opacity=".25"/>
    <rect x="18" y="17" width="300" height="362" rx="24" fill="#F1F6FC"/>
    <rect x="0" y="0" width="300" height="362" rx="24" fill="#FFFFFF"/>
    <rect x="0" y="0" width="300" height="60" rx="24" fill="#EAF2FA"/>
    <path d="M0 36h300v24H0z" fill="#EAF2FA"/>
    <g fill="#47718D">
      <circle cx="27" cy="30" r="5"/>
      <circle cx="45" cy="30" r="5" fill-opacity=".55"/>
      <circle cx="63" cy="30" r="5" fill-opacity=".3"/>
    </g>
    <text x="25" y="92" fill="#19324C" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Recent research signals</text>
    <text x="25" y="118" fill="#647B90" font-family="Segoe UI, Arial, sans-serif" font-size="12">A snapshot of new AI papers on arXiv</text>
    <rect x="25" y="143" width="250" height="62" rx="13" fill="#F2F7FB"/>
    <circle cx="48" cy="174" r="12" fill="#D8F3EC"/>
    <path d="M43 174h10M48 169v10" stroke="#178F7D" stroke-width="2" stroke-linecap="round"/>
    <text x="69" y="171" fill="#28465F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Agent workflows</text>
    <text x="69" y="190" fill="#75899B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Papers, sources, and research ideas</text>
    <rect x="25" y="220" width="250" height="62" rx="13" fill="#F2F7FB"/>
    <circle cx="48" cy="251" r="12" fill="#E6EBFF"/>
    <path d="M43 254l4-7 4 4 4-7" fill="none" stroke="#526EC6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="69" y="248" fill="#28465F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Research roadmap</text>
    <text x="69" y="267" fill="#75899B" font-family="Segoe UI, Arial, sans-serif" font-size="11">A practical 30 / 60 / 90-day plan</text>
    <rect x="25" y="304" width="166" height="34" rx="17" fill="url(#accent)"/>
    <text x="45" y="326" fill="#0A2335" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">EVIDENCE FIRST</text>
    <path d="M234 311l9 9 17-19" fill="none" stroke="#178F7D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2">
    <path d="M760 174h53l24-26"/>
    <path d="M742 407h70l35 27"/>
  </g>
  <circle cx="760" cy="174" r="5" fill="#68E0CF"/>
  <circle cx="742" cy="407" r="5" fill="#78A8FF"/>
  <circle cx="837" cy="148" r="5" fill="#68E0CF"/>
  <circle cx="847" cy="434" r="5" fill="#78A8FF"/>

  <text x="87" y="585" fill="#8299B0" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.2">OPEN SOURCE  ·  ARXIV-LINKED  ·  RESEARCHER-FOCUSED</text>
</svg>
